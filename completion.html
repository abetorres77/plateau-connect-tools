<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEI Progress %</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>
  :root {
    --navy: #252a2e; --blue: #0063a3; --blue-dark: #004f83; --orange: #f2c244; /* Plateau yellow accent */
    --paper: #f1f1f6; --ink: #252a2e; --soft: #6a6e79; --line: #cbcdd6; --ok: #1e8a44; --err: #da212c; --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--orange); outline-offset: 1px; border-color: var(--orange); }
  button:hover:not(:disabled) { filter: brightness(.93); }
  button.secondary:hover:not(:disabled), button.ghost:hover:not(:disabled) { background: var(--paper); filter: none; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Open Sans", "Segoe UI", -apple-system, sans-serif; font-size: 13px; line-height: 1.45; }
  header { background: #fff; color: var(--ink); border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; flex: 1; }
  header .ver { font-size: 10px; color: var(--soft); }
  main { padding: 8px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 10px; margin-bottom: 8px; }
  .card h2 { font-size: 13px; margin: 0 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: end; margin: 6px 0; }
  label { display: block; font-size: 11px; color: var(--soft); margin-bottom: 2px; }
  label.inline { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink); margin: 0; }
  select, input[type="text"], input[type="number"], input[type="search"], textarea { font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); max-width: 100%; }
  input[type="number"] { width: 90px; }
  textarea { width: 100%; min-height: 70px; font-family: Consolas, monospace; font-size: 11px; }
  button { font: inherit; font-weight: 600; padding: 6px 11px; border: none; border-radius: 4px; background: var(--blue); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  button.small { padding: 3px 8px; font-size: 11px; }
  button:disabled { opacity: .5; cursor: default; }
  #status { font-size: 12px; color: var(--soft); min-height: 1.2em; margin-top: 4px; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); } #status.warn { color: var(--warn); }
  .muted { color: var(--soft); font-size: 12px; }
  .models { display: flex; flex-direction: column; gap: 3px; max-height: 120px; overflow-y: auto; margin: 6px 0; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .tabs button { background: transparent; color: var(--soft); border-radius: 6px 6px 0 0; padding: 6px 10px; font-weight: 600; }
  .tabs button.active { color: var(--navy); border-bottom: 2px solid var(--orange); }
  .search { display: flex; gap: 6px; align-items: center; }
  .search input { flex: 1; min-width: 0; font-size: 14px; padding: 7px 9px; }
  .table-scroll { overflow: auto; max-height: 48vh; margin-top: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--soft); position: sticky; top: 0; background: #fff; }
  td.num, th.num { text-align: right; }
  tr.sel { cursor: pointer; } tr.sel:hover td { background: #fffbe6; } tr.active td { background: #fdf1bf; }
  .pill { display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 10px; background: #eef1f4; color: var(--soft); }
  .pill.pt { background: #e4f1e8; color: var(--ok); }
  details summary { cursor: pointer; color: var(--navy); font-weight: 600; font-size: 12px; }
  details { margin-top: 6px; }
  .kv { font-size: 11px; color: var(--soft); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  #props { margin-top: 6px; }
  #props h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--soft); margin: 8px 0 2px; }
  #props table { font-size: 11px; }
  #props td { white-space: normal; word-break: break-word; vertical-align: top; }
  #props td:first-child { color: var(--soft); width: 45%; }
  #d-key td:first-child, #d-geo td:first-child { color: var(--soft); width: 45%; }
  #d-key td, #d-geo td { white-space: normal; word-break: break-word; vertical-align: top; font-size: 12px; }
  #d-key, #d-geo { margin-bottom: 6px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid3 input { width: 100%; }
  [hidden] { display: none !important; }
  .switch { display: flex; gap: 4px; }
  .switch a { color: var(--ink); text-decoration: none; font-size: 11px; padding: 2px 9px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .switch a.on { background: var(--orange); border-color: var(--orange); color: var(--ink); font-weight: 600; }
  .switch a.close { font-weight: 700; padding: 2px 7px; }
  .switch a.close:hover { background: var(--paper); }
  @media (max-width: 420px) {
    main { padding: 6px; }
    .card { padding: 8px; }
    th, td { padding: 2px 4px; font-size: 11px; }
  }
</style>
<style>
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .tile { flex: 1 1 150px; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; }
  .tile .t { font-size: 11px; color: var(--soft); }
  .tile .big { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .tile .s { font-size: 11px; color: var(--soft); }
  td.Complete { background: #dafbe1; } td.Partial { background: #fff8c5; } td.NotStarted { background: #ffebe9; }
  .cats { display: flex; flex-direction: column; gap: 2px; max-height: 110px; overflow-y: auto; margin: 4px 0; }
  .cats label.inline { font-size: 12px; }
  select.model { max-width: 100%; width: 100%; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  @media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
</style></head>
<body>
<header><div class="dot"></div><h1>Progress %</h1><nav class="switch" id="switch"><a href="./index.html" class="on">&#9776; Tools</a><a href="#" class="close" id="close-tool" title="Close this tool and show the tools menu">&#10005;</a></nav><span class="ver" id="ver"></span></header>
<main>
  <div id="view-connecting" class="card">Connecting to Trimble Connect…</div>

  <div id="app" hidden>
    <div class="card">
      <div class="two">
        <div><label>Proposed (design) models - tick every design model the as-built covers</label><div class="models" id="m-proposed"></div></div>
        <div><label>As-built model</label><select id="m-asbuilt" class="model"></select></div>
      </div>
      <div class="row">
        <div><label>Units</label><select id="units"><option value="usft">US survey feet</option><option value="ift">International feet</option></select></div>
        <div><label>Tolerance (ft)</label><input type="number" id="tol" value="3" min="0.1" step="0.5"></div>

        <button class="small ghost" id="refresh">Refresh models</button>
      </div>
      <div class="row">
        <button id="run">Compare</button>
        <button class="small ghost" id="copy" disabled>Copy for Excel</button>
        <button class="small ghost" id="csv" disabled>CSV</button>
        <button class="small ghost" id="report" disabled>HTML report</button>
        <button class="small ghost" id="uncolor" disabled title="Put the as-built model back to its normal colors">Reset colors</button>
      </div>
      <div id="status"></div>
    </div>

    <div class="card" id="cat-card" hidden>
      <h2>Categories in scope (from the proposed model)</h2>
      <div class="cats" id="cats"></div>
    </div>

    <div class="tiles" id="tiles" hidden>
      <div class="tile"><div class="t">Overall completion</div><div class="big" id="t-overall">-</div><div class="s" id="t-overall-s"></div></div>
      <div class="tile"><div class="t">Pipe complete by design length</div><div class="big" id="t-pipes">-</div><div class="s" id="t-pipes-s"></div></div>
      <div class="tile"><div class="t">Structures</div><div class="big" id="t-points">-</div><div class="s" id="t-points-s"></div></div>
    </div>

    <div class="card" id="res-card" hidden>
      <div class="tabs">
        <button class="active" data-tab="cat">By category</button><button data-tab="size">By pipe size</button><button data-tab="model">By model</button><button data-tab="items">Items</button><button data-tab="abonly">As-built only</button>
      </div>
      <div class="row" id="item-filter" hidden>
        <select id="f-status"><option value="">All statuses</option><option>Complete</option><option>Not Started</option></select>
        <input type="search" id="f-text" placeholder="Find name, size, structure…" style="flex:1;min-width:120px">
        <span class="muted">Click a row: the viewer selects the objects and zooms to them.</span>
      </div>
      <div class="muted" id="count"></div>
      <div class="table-scroll"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    </div>
  </div>
</main>
<script type="module">
import * as WorkspaceAPI from "./trimbleconnect.workspace.api.js";
import * as C from "./completion-core.js";

const VERSION = C.VERSION;
const log = (...a) => console.log("[PEICompletion]", ...a);
const $ = (id) => document.getElementById(id);
const setStatus = (msg, cls = "") => { const s = $("status"); s.textContent = msg; s.className = cls; };
$("ver").textContent = VERSION;
$("switch").querySelector("a").addEventListener("click", (ev) => { ev.preventDefault(); try { localStorage.setItem("plateau:viewerTool", "menu"); } catch (e) { /* ignore */ } location.replace("./index.html?v=" + Date.now()); });

// Connect keeps this iframe alive when the panel is closed from the rail icon; when it comes back after being hidden, show the tools menu.
(function () {
  let hiddenSince = null;
  function goMenu() { try { localStorage.setItem("plateau:viewerTool", "menu"); } catch (e) { /* ignore */ } location.replace("./index.html?v=" + Date.now()); }
  function poll() {
    const r = document.documentElement.getBoundingClientRect();
    const hidden = window.innerWidth === 0 || window.innerHeight === 0 || r.width === 0 || r.height === 0;
    if (hidden) { if (hiddenSince == null) hiddenSince = Date.now(); return; }
    if (hiddenSince != null && Date.now() - hiddenSince > 400) goMenu();
    hiddenSince = null;
  }
  window.addEventListener("resize", poll);
  setInterval(poll, 300);
  window.plateauGoMenu = goMenu;
})();
$("close-tool").addEventListener("click", (ev) => { ev.preventDefault(); window.plateauGoMenu(); });

const UNIT_M = { usft: 1200 / 3937, ift: 0.3048 };
const CHUNK = 250;
let API = null, models = [], knownIds = new Set();
const cache = new Map();      // modelId -> { items, count, name }
let result = null, tab = "cat", busy = false;
let colored = null;           // { modelId, ids } of the model currently painted red
const AS_BUILT_COLOR = "#e02020";

// paint the as-built model red so it stands out from the design; "reset" puts the original colors back
async function colorModel(entry, color) {
  if (!entry || !API.viewer.setObjectState) return;
  const sel = { modelObjectIds: [{ modelId: entry.modelId, objectRuntimeIds: entry.ids }] };
  try { await API.viewer.setObjectState(sel, { color }); } catch (e) { log("setObjectState", e); }
}
async function uncolor() {
  if (colored) { await colorModel(colored, "reset"); colored = null; }
  $("uncolor").disabled = true;
}
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

async function init() {
  API = await WorkspaceAPI.connect(window.parent, (event, args) => {
    if (event === "viewer.onModelStateChanged") refreshModels().catch(e => log("refresh", e));
  }, 180000);
  if (!API.viewer) {
    $("view-connecting").innerHTML = "<h2>Open this tool inside the 3D Viewer</h2><p class='muted'>Progress % compares the models loaded in the 3D Viewer, so open it from the Plateau Tools icon in the viewer&#39;s left toolbar.</p>";
    return;
  }
  $("view-connecting").hidden = true;
  $("app").hidden = false;
  await refreshModels();
}

const looksAsBuilt = (n) => /(-|_)AB(\b|[._-])|AS-?BUILT|ASBUILT|RECORD/i.test(n || "");
async function refreshModels() {
  let all = [];
  try { all = (await API.viewer.getModels("loaded")) || []; } catch (e) { log("getModels", e); }
  models = all;
  const prevP = new Set(proposedIds()), hadP = document.querySelectorAll("#m-proposed input").length > 0, prevA = $("m-asbuilt").value;
  const ids = models.map(m => m.id);
  const ab = models.find(m => looksAsBuilt(m.name));
  const abId = ids.includes(prevA) ? prevA : (ab ? ab.id : "");
  const s = $("m-asbuilt"); s.innerHTML = "";
  const none = document.createElement("option"); none.value = ""; none.textContent = models.length ? "(choose a model)" : "(no models loaded)"; s.appendChild(none);
  for (const m of models) { const o = document.createElement("option"); o.value = m.id; o.textContent = m.name || m.id; s.appendChild(o); }
  s.value = abId;
  // proposed: tick boxes; keep the user's picks, otherwise every model that is not the as-built (a combined as-built covers several design models)
  const box = $("m-proposed"); box.innerHTML = "";
  if (!models.length) box.textContent = "(no models loaded)";
  for (const m of models) {
    const lab = document.createElement("label"); lab.className = "inline";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.value = m.id;
    cb.checked = hadP ? prevP.has(m.id) : (m.id !== abId);
    lab.appendChild(cb); lab.appendChild(document.createTextNode(m.name || m.id)); box.appendChild(lab);
  }
  knownIds = new Set(ids);
  if (!models.length) setStatus("No models loaded. Load the design and as-built models in the viewer, then Refresh models.", "warn");
}

// The viewer's object-level model id is sometimes ModelSpec.id and sometimes the file versionId: try both, then unfiltered.
async function listModelObjects(m) {
  const attempts = [
    { via: "id", sel: { modelObjectIds: [{ modelId: m.id }] } },
    { via: "id+recursive", sel: { modelObjectIds: [{ modelId: m.id, recursive: true }] } },
    { via: "versionId", sel: { modelObjectIds: [{ modelId: m.versionId }] } },
    { via: "versionId+recursive", sel: { modelObjectIds: [{ modelId: m.versionId, recursive: true }] } },
    { via: "all loaded", sel: undefined }
  ];
  for (const a of attempts) {
    if (a.sel && !a.sel.modelObjectIds[0].modelId) continue;
    let res;
    try { res = await API.viewer.getObjects(a.sel); } catch (e) { log("getObjects failed via " + a.via, e); continue; }
    let groups = (res || []).filter(r => r && (r.objects || []).length);
    if (!a.sel) groups = groups.filter(r => r.modelId === m.id || r.modelId === m.versionId || !r.modelId);
    const ids = groups.flatMap(r => r.objects.map(o => o.id));
    log("getObjects via " + a.via + ":", ids.length, "objects");
    if (ids.length) return { modelId: groups[0].modelId || m.id, ids, via: a.via };
  }
  return { modelId: m.id, ids: [], via: "nothing" };
}

const proposedIds = () => [...document.querySelectorAll("#m-proposed input:checked")].map(i => i.value);
// the proposed side is the union of every ticked design model
function combinedProposed(ids) {
  const parts = ids.map(id => cache.get(id)).filter(Boolean);
  if (!parts.length || parts.length < ids.length) return null;
  return { items: parts.flatMap(p => p.items), count: parts.reduce((n, p) => n + p.count, 0), name: parts.map(p => p.name).join(" + ") };
}

async function readModel(m, label) {
  if (cache.has(m.id)) return cache.get(m.id);
  setStatus("Listing objects in " + m.name + "…");
  const found = await listModelObjects(m);
  if (!found.ids.length) throw new Error("The viewer returned no objects for " + m.name + ". Wait for it to finish loading, then try again.");
  const objs = [];
  for (let i = 0; i < found.ids.length; i += CHUNK) {
    setStatus("Reading " + label + " properties… " + i + " / " + found.ids.length);
    const props = await API.viewer.getObjectProperties(found.modelId, found.ids.slice(i, i + CHUNK));
    for (const op of (props || [])) objs.push(op);
  }
  // objects without Civil 3D coordinates (3D solids, blocks, every Revit element) get a location from their bounding box
  const revit = C.isRevitModel(objs);
  log(label + ": " + objs.length + " nodes, revit=" + revit);
  const boxes = new Map();
  const need = objs.filter(o => C.needsBox(o, revit)).map(o => o.id);
  if (need.length && API.viewer.getObjectBoundingBoxes) {
    for (let i = 0; i < need.length; i += CHUNK) {
      setStatus("Reading " + label + " geometry… " + i + " / " + need.length);
      try { for (const b of ((await API.viewer.getObjectBoundingBoxes(found.modelId, need.slice(i, i + CHUNK))) || [])) if (b && b.boundingBox) boxes.set(b.id, b.boundingBox); }
      catch (e) { log("getObjectBoundingBoxes", e); break; }
    }
  }
  // A Revit structure element has no geometry of its own (its solids are child nodes). If the viewer gave no box for the
  // element itself, take the union of its children's boxes.
  const missing = revit ? need.filter(id => !boxes.has(id)) : [];
  if (missing.length && API.viewer.getHierarchyChildren && API.viewer.getObjectBoundingBoxes) {
    log(label + ": " + missing.length + " elements without a bounding box, reading their children");
    let done = 0, failed = 0;
    const one = async (id) => {
      try {
        const raw = await API.viewer.getHierarchyChildren(found.modelId, [id], true);
        const kids = []; const walk = (x) => { if (x == null) return; if (Array.isArray(x)) { x.forEach(walk); return; } if (typeof x === "number") kids.push(x); else if (typeof x === "object") { if (typeof x.id === "number") kids.push(x.id); if (x.objects) walk(x.objects); if (x.children) walk(x.children); } };
        walk(raw);
        if (!kids.length) return;
        const bb = (await API.viewer.getObjectBoundingBoxes(found.modelId, kids)) || [];
        let u = null;
        for (const b of bb) { if (!b || !b.boundingBox) continue; const x = b.boundingBox; if (!u) u = { min: { ...x.min }, max: { ...x.max } }; else { for (const k of ["x", "y", "z"]) { u.min[k] = Math.min(u.min[k], x.min[k]); u.max[k] = Math.max(u.max[k], x.max[k]); } } }
        if (u) boxes.set(id, u);
      } catch (e) { if (failed++ < 3) log("getHierarchyChildren", e); }
      finally { if (++done % 25 === 0) setStatus("Reading " + label + " structure geometry… " + done + " / " + missing.length); }
    };
    for (let i = 0; i < missing.length; i += 8) await Promise.all(missing.slice(i, i + 8).map(one));
    log(label + ": boxes now " + boxes.size + " of " + need.length + " needed");
  }
  const items = C.parseObjects(objs, { modelId: found.modelId, modelName: m.name, unitM: UNIT_M[$("units").value], boxes, revit });
  const entry = { items, count: objs.length, name: m.name, modelId: found.modelId, ids: found.ids };
  cache.set(m.id, entry);
  return entry;
}

function fillCategories(items) {
  const keep = new Set([...document.querySelectorAll("#cats input:checked")].map(i => i.value));
  const had = document.querySelectorAll("#cats input").length > 0;
  const box = $("cats"); box.innerHTML = "";
  for (const c of [...new Set(items.filter(C.isNetworkObject).map(i => i.category))].sort()) {
    const lab = document.createElement("label"); lab.className = "inline";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.value = c; cb.checked = !had || keep.has(c);
    cb.addEventListener("change", () => { if (!busy) compareOnly(); });
    lab.appendChild(cb); lab.appendChild(document.createTextNode(c)); box.appendChild(lab);
  }
  $("cat-card").hidden = false;
}

async function run() {
  if (busy) return;
  const pids = proposedIds().filter(id => id !== $("m-asbuilt").value), aid = $("m-asbuilt").value;
  if (!pids.length || !aid) { setStatus("Tick at least one proposed model and pick the as-built model.", "warn"); return; }
  busy = true; $("run").disabled = true;
  try {
    const ma = models.find(m => m.id === aid);
    for (const pid of pids) await readModel(models.find(m => m.id === pid), "proposed " + (pids.indexOf(pid) + 1) + "/" + pids.length);
    const P = combinedProposed(pids), A = await readModel(ma, "as-built");
    if (colored && colored.modelId !== A.modelId) await uncolor();
    await colorModel(A, AS_BUILT_COLOR); colored = A; $("uncolor").disabled = false;
    fillCategories(P.items);
    compareOnly();
  } catch (e) {
    log("run failed", e); setStatus("Failed: " + (e && e.message ? e.message : e), "err");
  } finally { busy = false; $("run").disabled = false; }
}

function compareOnly() {
  const P = combinedProposed(proposedIds().filter(id => id !== $("m-asbuilt").value)), A = cache.get($("m-asbuilt").value);
  if (!P || !A) return;
  const checked = [...document.querySelectorAll("#cats input:checked")].map(i => i.value);
  const all = document.querySelectorAll("#cats input").length;
  const opt = { toleranceFt: parseFloat($("tol").value) || 3, includedCategories: (all && checked.length < all) ? new Set(checked) : null };
  result = C.compare(P.items, A.items, opt);
  result.meta = { proposedName: P.name, asBuiltName: A.name, proposedCount: P.count, asBuiltCount: A.count, generated: new Date().toLocaleString() };
  render();
  setStatus("Compared " + result.items.length + " proposed pipes/structures against " + result.modelAsBuiltCount + " as-built pipes/structures (" + (result.ignored.length + result.asBuiltIgnored) + " objects that are not pipes or structures ignored). " + result.asBuiltOnly.length + " as-built objects had no proposed counterpart.", "ok");
  for (const id of ["copy", "csv", "report"]) $(id).disabled = false;
}

function render() {
  const r = result; if (!r) return;
  $("tiles").hidden = false; $("res-card").hidden = false;
  $("t-overall").textContent = C.pct(C.pctByCount(r.overall)); $("t-overall-s").textContent = r.overall.complete + " of " + r.overall.count + " items complete";
  $("t-pipes").textContent = C.pct(C.pctByLength(r.pipes)); $("t-pipes-s").textContent = C.lenF(r.pipes.installedLen) + " of " + C.lenF(r.pipes.proposedLen) + " LF";
  $("t-points").textContent = C.pct(C.pctByCount(r.points)); $("t-points-s").textContent = r.points.complete + " of " + r.points.count + " complete";
  renderTable();
}
const TH = {
  cat: ["Category", "Items", "Complete", "Not started", "% complete", "Design LF", "Complete LF", "% by length"],
  size: ["Pipe size", "Pipes", "Complete", "Not started", "% complete", "Design LF", "Complete LF", "% by length"],
  model: ["Proposed model", "Items", "Complete", "Not started", "% complete", "Design LF", "Complete LF", "% by length"],
  items: ["Status", "Model", "Type", "Name", "Description", "Layer", "Design LF", "Matched as-built", "Match", "Dist ft", "From", "To"],
  abonly: ["Type", "Name", "Description", "Layer", "Easting", "Northing"]
};
const NUM = { cat: [1, 2, 3, 4, 5, 6, 7], size: [1, 2, 3, 4, 5, 6, 7], model: [1, 2, 3, 4, 5, 6, 7], items: [6, 9], abonly: [4, 5] };
const f1 = v => isNaN(v) ? "" : Number(v).toFixed(1);
const f0 = v => isNaN(v) ? "" : Number(v).toFixed(0);

function visibleItems() {
  const st = $("f-status").value, q = $("f-text").value.trim().toLowerCase();
  return result.items.filter(it => (!st || it.status === st) && (!q || [it.proposed.name, it.proposed.model, it.proposed.desc, it.proposed.layer, C.asBuiltNames(it), C.startStruct(it.proposed), C.endStruct(it.proposed)].some(s => String(s || "").toLowerCase().includes(q))));
}

function renderTable() {
  const r = result; if (!r) return;
  $("item-filter").hidden = tab !== "items";
  const thead = $("tbl").querySelector("thead"), tbody = $("tbl").querySelector("tbody");
  thead.innerHTML = "<tr>" + TH[tab].map((h, i) => "<th" + (NUM[tab].includes(i) ? ' class="num"' : "") + ">" + esc(h) + "</th>").join("") + "</tr>";
  const rows = [];
  const cell = (v, i, cls) => "<td" + ((NUM[tab].includes(i) ? ' class="num' + (cls ? " " + cls : "") + '"' : (cls ? ' class="' + cls + '"' : ""))) + ">" + esc(v) + "</td>";
  if (tab === "cat" || tab === "size" || tab === "model") {
    const groups = tab === "cat" ? r.byCategory : (tab === "size" ? r.bySize : r.byModel);
    for (const g of groups) {
      const v = [g.key, g.count, g.complete, g.notStarted, f1(C.pctByCount(g)), g.proposedLen > 0 ? f1(g.proposedLen) : "", g.proposedLen > 0 ? f1(g.installedLen) : "", g.proposedLen > 0 ? f1(C.pctByLength(g)) : ""];
      rows.push("<tr>" + v.map((x, i) => cell(x, i)).join("") + "</tr>");
    }
    $("count").textContent = groups.length + " rows";
  } else if (tab === "items") {
    const list = visibleItems();
    list.forEach((it, idx) => {
      const p = it.proposed;
      const v = [it.status, p.model, p.type, p.name, p.desc, p.layer, p.isPipeLike ? f1(it.proposedLen) : "", C.asBuiltNames(it), it.method, f1(it.dist), C.startStruct(p), C.endStruct(p)];
      rows.push('<tr class="sel" data-i="' + idx + '">' + v.map((x, i) => cell(x, i, i === 0 ? it.status.replace(" ", "") : "")).join("") + "</tr>");
    });
    $("count").textContent = list.length + " of " + r.items.length + " proposed objects";
  } else {
    r.asBuiltOnly.forEach((a, idx) => {
      const v = [a.type, a.name, a.desc, a.layer, f1(a.midX), f1(a.midY)];
      rows.push('<tr class="sel" data-ab="' + idx + '">' + v.map((x, i) => cell(x, i)).join("") + "</tr>");
    });
    $("count").textContent = r.asBuiltOnly.length + " as-built objects with no proposed counterpart";
  }
  tbody.innerHTML = rows.join("");
}

async function selectRow(tr) {
  if (!result) return;
  let groups = [];
  if (tr.dataset.i != null) {
    const it = visibleItems()[+tr.dataset.i]; if (!it) return;
    groups.push({ modelId: it.proposed.modelId, objectRuntimeIds: [it.proposed.id] });
    for (const a of it.asBuilt) { const g = groups.find(x => x.modelId === a.modelId); if (g) g.objectRuntimeIds.push(a.id); else groups.push({ modelId: a.modelId, objectRuntimeIds: [a.id] }); }
  } else if (tr.dataset.ab != null) {
    const a = result.asBuiltOnly[+tr.dataset.ab]; if (!a) return;
    groups.push({ modelId: a.modelId, objectRuntimeIds: [a.id] });
  }
  if (!groups.length) return;
  for (const x of $("tbl").querySelectorAll("tr.active")) x.classList.remove("active");
  tr.classList.add("active");
  try {
    await API.viewer.setSelection({ modelObjectIds: groups }, "set");
    // zoom to the highlighted object(s): fit the camera to the selection
    try { await API.viewer.setCamera({ modelObjectIds: groups }, { animationTime: 500 }); } catch (e) { log("setCamera", e); }
  } catch (e) { log("select", e); }
}

function download(name, text, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: mime || "text/plain" })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const stem = () => (result && result.meta.proposedName ? result.meta.proposedName.replace(/\.[^.]+$/, "") : "model") + "_completion_" + new Date().toISOString().slice(0, 10);
async function copyExcel() {
  if (!result) return;
  const text = C.summaryRows(result).map(r => r.join("\t")).join("\n");
  try { await navigator.clipboard.writeText(text); setStatus("Summary copied; paste into Excel.", "ok"); }
  catch (e) { download(stem() + "_summary.txt", text); setStatus("Clipboard blocked; downloaded the summary as a text file instead.", "warn"); }
}

// diagnostic / automation hook (harness and browser automation post from the top frame)
window.addEventListener("message", async (ev) => {
  const d = ev.data; if (!d || !d.plateauCmd) return;
  const reply = (o) => { try { ev.source.postMessage(Object.assign({ plateauResult: d.plateauCmd, from: "completion" }, o), "*"); } catch (e) { log("reply", e); } };
  if (d.plateauCmd === "status") reply({ text: VERSION + " models=" + models.length + " result=" + (result ? "yes" : "no") });
  else if (d.plateauCmd === "run") { await run(); reply({ text: result ? C.textSummary(result, result.meta) : $("status").textContent }); }
  else if (d.plateauCmd === "summary") reply({ text: result ? C.textSummary(result, result.meta) : "no result", rows: result ? C.summaryRows(result) : null });
  else if (d.plateauCmd === "items") reply({ text: result ? C.itemsCsv(result) : "no result" });
});

$("run").addEventListener("click", run);
$("refresh").addEventListener("click", () => refreshModels());
for (const b of document.querySelectorAll(".tabs button")) b.addEventListener("click", () => { for (const x of document.querySelectorAll(".tabs button")) x.classList.toggle("active", x === b); tab = b.dataset.tab; renderTable(); });
$("f-status").addEventListener("change", renderTable);
$("f-text").addEventListener("input", renderTable);
$("tbl").addEventListener("click", (ev) => { const tr = ev.target.closest("tr.sel"); if (tr) selectRow(tr); });
$("copy").addEventListener("click", copyExcel);
$("csv").addEventListener("click", () => { if (result) download(stem() + ".csv", C.itemsCsv(result), "text/csv"); });
$("report").addEventListener("click", () => { if (result) download(stem() + ".html", C.htmlReport(result, result.meta), "text/html"); });
$("uncolor").addEventListener("click", uncolor);
$("tol").addEventListener("change", () => { if (result && !busy) compareOnly(); });
$("units").addEventListener("change", () => { cache.clear(); result = null; $("tiles").hidden = true; $("res-card").hidden = true; });
for (const id of ["m-proposed", "m-asbuilt"]) $(id).addEventListener("change", () => { uncolor(); result = null; $("tiles").hidden = true; $("res-card").hidden = true; $("cat-card").hidden = true; });
$("m-asbuilt").addEventListener("change", () => { const a = $("m-asbuilt").value; for (const cb of document.querySelectorAll("#m-proposed input")) if (cb.value === a) cb.checked = false; });
init().catch(err => { $("view-connecting").textContent = "Could not connect to Trimble Connect: " + err.message; });
</script>
</body>
